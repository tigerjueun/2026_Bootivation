name: Fusion tests

on:
  push:
    branches: [main]
    paths:
      - "fusion_pc/**"
      - "shared/schemas/**"
      - ".github/workflows/fusion-tests.yml"
  pull_request:
    paths:
      - "fusion_pc/**"
      - "shared/schemas/**"
      - ".github/workflows/fusion-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fusion_pc/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fusion_pc/requirements.txt

      - name: Compile final entry points
        working-directory: fusion_pc
        run: |
          python -m py_compile \
            main.py \
            src/bootivation_fusion/adapters/retail_zmq.py \
            src/bootivation_fusion/adapters/vision_emergency.py \
            tools/send_vision_emergency.py

      - name: Run unit tests
        working-directory: fusion_pc
        run: python -m unittest discover -s tests -p "test_*.py" -v
